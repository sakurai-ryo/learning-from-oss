allowBuilds:
  esbuild: true
  sharp: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# pnpm 11 は公開 24 時間未満のパッケージを拒否する (minimumReleaseAge)。
# starlight は公開直後の版を使うことがあるので例外にする
minimumReleaseAgeExclude:
  - "@astrojs/starlight"
